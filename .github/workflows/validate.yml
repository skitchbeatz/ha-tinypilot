name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # Note: no hacs/action job here. That action validates requirements for
  # inclusion in the *public* default HACS store (brand assets in
  # home-assistant/brands, a publicly fetchable manifest, etc.) -- this repo
  # is private and only ever installed via HACS "Custom repositories", so
  # those checks don't apply and will always fail on a private repo.

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest tests/ -q
